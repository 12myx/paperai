services:
  app:
    build: .
    container_name: paperlens
    restart: unless-stopped
    env_file:
      - deploy/.env.production
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
